[project]
name = "eu-transport-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over EU road transport legislation."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Ignore releases younger than a week, so a broken or compromised release has time to be yanked.
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "rag"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
