# The reranking model checkpoint G uses (docs/DECISIONS.md, "reranking is done by Qwen3-Reranker
# 0.6B, run locally"). It runs on the owner's Mac and costs nothing; `make rerank RUN=1` runs it.
#
# The revision pins the model's files to one commit on Hugging Face
# (https://huggingface.co/Qwen/Qwen3-Reranker-0.6B, Apache 2.0), so a later upload can never
# change the scores; the cache key includes it. The device is in the key too, since the GPU and
# the CPU round differently, and a machine without MPS refuses rather than mixing them.
#
# The instruction goes before each question in the form the model was trained on
# ("<Instruct>: …", "<Query>: …", "<Document>: …"). It is the embedding model's task, word for
# word, so that both models are asked the same thing.
model_id: Qwen/Qwen3-Reranker-0.6B
revision: e61197ed45024b0ed8a2d74b80b4d909f1255473
device: mps
max_input_tokens: 8192
instruction: "Given a question about EU road transport law, retrieve the passages of legislation and Commission guidance that answer it"
#
# Other instructions, compared with the main one on the dev questions (#99) and used by no other
# run. "needed" asks whether the answer relies on the passage, and says that a question may need
# several: in #84 the main instruction kept one of two needed passages high and let the other
# slip below a related passage. Its wording was fixed before any score was seen.
other_instructions:
  needed: "Given a question about EU road transport law, judge whether the answer relies on this passage. A question may need several passages, such as a rule, its exceptions and the definitions it uses; each of them counts"
