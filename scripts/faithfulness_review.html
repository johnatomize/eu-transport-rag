<title>Faithfulness Labels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: the same reviewer's desk as the gold answer review. Answer list on the left, one
   answer at a time on the right: its sentences, then the text it cites, the verdict pinned under. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #18202d;
  --muted: #5a6474;
  --rule: #dce1e9;
  --accent: #2440a8;
  --accent-soft: #e5e9f9;
  --ok: #1d7549;
  --ok-soft: #e1f1e8;
  --bad: #a8361f;
  --bad-soft: #f9e4de;
  --mark: #fff0a8;
  --mark-ink: #18202d;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-law: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-id: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #161b24; --ink: #e5e8ee; --muted: #98a1b0; --rule: #283040;
    --accent: #8fa3ff; --accent-soft: #1d2645; --ok: #5ccc8f; --ok-soft: #13301f;
    --bad: #f08a70; --bad-soft: #3a1a12; --mark: #5c4c12; --mark-ink: #fff6d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #161b24; --ink: #e5e8ee; --muted: #98a1b0; --rule: #283040;
  --accent: #8fa3ff; --accent-soft: #1d2645; --ok: #5ccc8f; --ok-soft: #13301f;
  --bad: #f08a70; --bad-soft: #3a1a12; --mark: #5c4c12; --mark-ink: #fff6d6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--rule); padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.brand small { color: var(--muted); font-size: 12.5px; }
.progress { flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--rule); }
.bar span { display: block; height: 100%; transition: width .3s ease; }
.bar .b-ok { background: var(--ok); }
.bar .b-bad { background: var(--bad); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 600; }
.sync { font-size: 12.5px; color: var(--muted); }
.sync.warn { color: var(--bad); }
.tool, .list-toggle { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.list-toggle { display: none; }
.export { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--accent-soft); border-bottom: 1px solid var(--rule); }
.export-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.export-inner p { margin: 0; font-size: 13.5px; }
.export-inner textarea { width: 100%; font-family: var(--font-id); font-size: 12px; padding: 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }

.layout {
  display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 24px;
  max-width: 1400px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.list { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 20px); align-self: start; max-height: calc(100vh - var(--top-h) - 40px); display: flex; flex-direction: column; min-width: 0; }
.rows { list-style: none; margin: 0; padding: 0; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.rows li + li { border-top: 1px solid var(--rule); }
.rows li.pair { border-top-color: transparent; }
.rows button { display: grid; grid-template-columns: 14px 64px minmax(0, 1fr); gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; }
.rows button:hover { background: var(--bg); }
.rows button[aria-current="true"] { background: var(--accent-soft); }
.rows .qid { font-family: var(--font-id); font-size: 12.5px; color: var(--muted); }
.rows .qt { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .pair .qt { color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; transform: translateY(1px); }
.dot.supported { background: var(--ok); border-color: var(--ok); }
.dot.unsupported { background: var(--bad); border-color: var(--bad); }

.detail { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.head .qid { font-family: var(--font-id); font-size: 14px; font-weight: 500; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; color: var(--accent); background: var(--accent-soft); font-weight: 500; white-space: nowrap; }
.nav { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 4px 10px; }
.question { margin: 0; font-size: 22px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; max-width: 48ch; }
.rule { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 76ch; }
.rule summary { cursor: pointer; color: var(--ink); font-weight: 500; }
.rule ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

.section { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.hint { font-size: 13px; color: var(--bad); }
.sentences { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); overflow: hidden; max-width: 80ch; }
.sentences li + li { border-top: 1px solid var(--rule); }
.sentences button { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; font-size: 16px; line-height: 1.5; }
.sentences button:disabled { cursor: default; color: inherit; }
.sentences .n { font-family: var(--font-id); font-size: 12px; color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; }
.sentences.picking button:hover { background: var(--bad-soft); }
.sentences button[aria-pressed="true"] { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.sentences button.after { color: var(--muted); }

.node { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); overflow: hidden; }
.node-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.node-id { font-family: var(--font-id); font-size: 13px; font-weight: 500; }
.node-path { font-size: 12.5px; color: var(--muted); flex: 1 1 240px; min-width: 0; }
.node-head a { font-size: 12.5px; white-space: nowrap; }
.law { margin: 0; padding: 12px 14px; font-family: var(--font-law); font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 78ch; }
.law.lead-in { padding-bottom: 0; color: var(--muted); font-size: 14.5px; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.quote-missing { padding: 8px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--rule); }

.verdict {
  position: sticky; bottom: 0; z-index: 3; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 14px; align-items: start;
  box-shadow: 0 -6px 18px -12px rgba(10, 20, 40, .35);
}
.verdict-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.vbtn { border: 1.5px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.vbtn kbd { font-family: var(--font-id); font-size: 11px; font-weight: 400; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }
.vbtn.ok[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.vbtn.bad[aria-pressed="true"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.vbtn:disabled { opacity: .5; cursor: not-allowed; }
.note-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.note-wrap textarea { width: 100%; min-height: 44px; resize: vertical; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); font-size: 14px; line-height: 1.45; }
.note-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); }
.note-meta .err { color: var(--bad); }
.keys kbd { font-family: var(--font-id); font-size: 11px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }

@media (max-width: 899px) {
  .top { position: static; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .list { position: static; max-height: none; }
  .list:not(.open) { display: none; }
  .rows { max-height: 55vh; }
  .list-toggle { display: inline-block; }
  .question { font-size: 19px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

<header class="top" id="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Faithfulness labels</h1>
      <small>Issue #82 · F's dev answers, shown blind as A and B</small>
    </div>
    <div class="progress">
      <div class="bar" aria-hidden="true"><span class="b-ok" id="bar-ok"></span><span class="b-bad" id="bar-bad"></span></div>
      <div class="counts" id="counts"></div>
    </div>
    <span class="sync" id="sync">Connecting to saved labels…</span>
    <button class="tool" id="export" type="button" title="Copy every label as JSON, to hand to Claude">Copy labels</button>
    <button class="list-toggle" id="list-toggle" type="button" aria-expanded="false" aria-controls="list">All answers</button>
  </div>
</header>

<section class="export" id="export-panel" hidden aria-label="Labels as JSON">
  <div class="export-inner">
    <p id="export-msg"></p>
    <textarea id="export-text" rows="6" readonly aria-label="Labels as JSON"></textarea>
    <button class="tool" id="export-close" type="button">Close</button>
  </div>
</section>

<div class="layout">
  <nav class="list" id="list" aria-label="Answers"><ul class="rows" id="rows"></ul></nav>
  <main class="detail" id="detail"></main>
</div>

<script id="review-data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("review-data").textContent);
  const ITEMS = DATA.items;
  const TYPE_NAMES = {
    single_fact: "Single fact", definition: "Definition", exception: "Exception",
    multi_article: "Multi-article", cross_act: "Cross-act", version_trap: "Version trap",
  };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("fl:" + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("fl:" + k, JSON.stringify(v)); } catch {} },
  };
  const ui = Object.assign({ current: ITEMS[0].key }, store.get("ui") || {});
  if (!ITEMS.some(i => i.key === ui.current)) ui.current = ITEMS[0].key;

  const labels = new Map();   // key -> {verdict, sentence, note, at}
  const LOCAL = !(window.claude && typeof window.claude.use === "function");
  let db = null, canWrite = false, loaded = false;
  const chains = new Map(), noteTimers = new Map();
  const labelOf = k => labels.get(k) || {};
  const done = k => { const l = labelOf(k); return l.verdict === "supported" || (l.verdict === "unsupported" && Number.isInteger(l.sentence)); };
  const setSync = (text, warn) => { const el = $("sync"); el.textContent = text; el.classList.toggle("warn", !!warn); };

  // A quote is word for word in its node's text, but line breaks and spaces may differ.
  function highlight(text, quotes) {
    const ranges = [];
    const missing = [];
    for (const q of quotes) {
      const words = q.trim().split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      const m = words.length ? new RegExp(words.join("\\s+")).exec(text) : null;
      if (m) ranges.push([m.index, m.index + m[0].length]); else missing.push(q);
    }
    ranges.sort((a, b) => a[0] - b[0]);
    let out = "", last = 0;
    for (const [s, e] of ranges) {
      if (e <= last) continue;
      const from = Math.max(s, last);
      out += esc(text.slice(last, from)) + "<mark>" + esc(text.slice(from, e)) + "</mark>";
      last = e;
    }
    return { html: out + esc(text.slice(last)), missing };
  }

  function renderCounts() {
    let ok = 0, bad = 0;
    for (const i of ITEMS) if (done(i.key)) labelOf(i.key).verdict === "supported" ? ok++ : bad++;
    const n = ITEMS.length;
    $("bar-ok").style.width = (100 * ok / n) + "%";
    $("bar-bad").style.width = (100 * bad / n) + "%";
    $("counts").innerHTML = `<span><b>${ok + bad}</b> of ${n} labelled</span><span><b>${ok}</b> supported</span>` +
      `<span><b>${bad}</b> not supported</span><span><b>${n - ok - bad}</b> to label</span>`;
  }

  function renderList() {
    $("rows").innerHTML = ITEMS.map(i => {
      const v = done(i.key) ? labelOf(i.key).verdict : "";
      const name = v === "supported" ? "supported" : v === "unsupported" ? "not supported" : "to label";
      return `<li class="${i.letter === "A" ? "" : "pair"}"><button type="button" data-k="${i.key}" aria-current="${i.key === ui.current}" title="${esc(i.question)}">` +
        `<span class="dot ${v}" role="img" aria-label="${name}"></span><span class="qid">${i.question_id} · ${i.letter}</span>` +
        `<span class="qt">${i.letter === "A" ? esc(i.question) : "Second answer"}</span></button></li>`;
    }).join("");
    const cur = $("rows").querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  function nodeCard(id, quotes) {
    const n = DATA.nodes[id];
    const h = highlight(n.text, quotes);
    return `<article class="node">
      <div class="node-head"><span class="node-id">${esc(id)}</span><span class="node-path">${esc(n.path.join(" › "))}</span>
        <a href="${esc(n.link)}" target="_blank" rel="noopener">${n.is_note ? "Open the PDF" : "Open on EUR-Lex"} ↗</a></div>
      ${n.lead_in ? `<p class="law lead-in">${esc(n.lead_in)}</p>` : ""}
      <p class="law">${h.html}</p>
      ${h.missing.length ? `<div class="quote-missing">Quoted but not found as written above: “${esc(h.missing.join("” · “"))}”</div>` : ""}
    </article>`;
  }

  function renderDetail() {
    const item = ITEMS.find(i => i.key === ui.current);
    const pos = ITEMS.indexOf(item);
    const byNode = new Map();
    for (const c of item.citations) { if (!byNode.has(c.node_id)) byNode.set(c.node_id, []); byNode.get(c.node_id).push(c.quote); }
    $("detail").innerHTML = `
      <div class="head">
        <span class="qid">${item.question_id} · answer ${item.letter}</span>
        <span class="chip">${TYPE_NAMES[item.type] || item.type}</span>
        <div class="nav"><span>${pos + 1} of ${ITEMS.length}</span>
          <button type="button" id="prev" aria-label="Previous answer">←</button>
          <button type="button" id="next" aria-label="Next answer">→</button></div>
      </div>
      <h2 class="question">${esc(item.question)}</h2>
      <details class="rule" id="rule"${store.get("rule-closed") ? "" : " open"}>
        <summary>What counts as supported</summary>
        <ul>
          <li>Every claim in the answer follows from the full text of the passages it cites below, not only the highlighted quotes.</li>
          <li>Simple arithmetic on cited numbers counts as supported, when every number in it is in the cited text: 90 hours in two weeks and 56 in one give at most 34 in the other.</li>
          <li>Whether the answer is correct or complete doesn't matter here, only whether the cited text backs it. Saying that the passages don't cover something isn't a claim.</li>
          <li>When a sentence isn't supported, pick the first one that isn't. Use the note for anything unclear.</li>
        </ul>
      </details>
      <section class="section">
        <div class="label">The answer · ${item.sentences.length} sentence${item.sentences.length > 1 ? "s" : ""}</div>
        <p class="hint" id="pick-hint" hidden>Click the first sentence that isn't supported.</p>
        <ol class="sentences" id="sentences">${item.sentences.map((s, i) =>
          `<li><button type="button" data-s="${i}" aria-pressed="false"><span class="n">${i + 1}</span><span>${esc(s)}</span></button></li>`).join("")}</ol>
      </section>
      <section class="section">
        <div class="label">Cited text · ${byNode.size} passage${byNode.size > 1 ? "s" : ""}, quotes highlighted</div>
        ${[...byNode].map(([id, qs]) => nodeCard(id, qs)).join("")}
      </section>
      <section class="verdict" aria-label="Your label">
        <div class="verdict-buttons">
          <button type="button" class="vbtn ok" id="v-ok" aria-pressed="false">Supported <kbd>1</kbd></button>
          <button type="button" class="vbtn bad" id="v-bad" aria-pressed="false">Not supported <kbd>2</kbd></button>
        </div>
        <div class="note-wrap">
          <textarea id="note" rows="2" placeholder="Optional: what isn't backed, or why it was a close call" aria-label="Note on ${item.key}"></textarea>
          <div class="note-meta"><span id="note-state"></span><span class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> supported · <kbd>2</kbd> not supported</span></div>
        </div>
      </section>`;
    renderVerdict(true);
  }

  function renderVerdict(fillNote) {
    const l = labelOf(ui.current);
    const ok = $("v-ok"), bad = $("v-bad"), note = $("note");
    if (!ok) return;
    ok.setAttribute("aria-pressed", String(l.verdict === "supported"));
    bad.setAttribute("aria-pressed", String(l.verdict === "unsupported"));
    ok.disabled = bad.disabled = note.disabled = !canWrite;
    const picking = canWrite && l.verdict === "unsupported";
    $("sentences").classList.toggle("picking", picking);
    $("pick-hint").hidden = !(picking && !Number.isInteger(l.sentence));
    $("sentences").querySelectorAll("button").forEach(b => {
      const i = Number(b.dataset.s);
      b.disabled = !picking;
      b.setAttribute("aria-pressed", String(l.verdict === "unsupported" && l.sentence === i));
      b.classList.toggle("after", l.verdict === "unsupported" && Number.isInteger(l.sentence) && i > l.sentence);
    });
    if ((fillNote || document.activeElement !== note) && !noteTimers.has(ui.current)) note.value = l.note || "";
    const state = $("note-state");
    state.classList.remove("err");
    if (!canWrite) state.textContent = loaded ? "Read only: only the owner can record labels." : "Waiting for saved labels…";
    else if (l.verdict === "unsupported" && !Number.isInteger(l.sentence)) state.textContent = "Pick the first unsupported sentence";
    else if (l.at) state.textContent = "Saved " + new Date(l.at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    else state.textContent = "Not labelled yet";
  }

  const renderAll = () => { renderCounts(); renderList(); renderDetail(); };

  function write(key, patch) {
    if ((!db && !LOCAL) || !canWrite) return Promise.resolve();
    const prev = labelOf(key);
    const body = { verdict: prev.verdict || null, sentence: Number.isInteger(prev.sentence) ? prev.sentence : null, note: prev.note || "", ...patch, at: new Date().toISOString() };
    labels.set(key, body);
    if (LOCAL) { store.set("labels", Object.fromEntries(labels)); return Promise.resolve(); }
    const run = () => db.doc("labels/" + key).set(body);
    const chain = (chains.get(key) || Promise.resolve()).then(run, run);
    chains.set(key, chain.catch(() => {}));
    return chain.catch(() => {
      const state = $("note-state");
      if (state && ui.current === key) { state.textContent = "Couldn't save. Check your connection, then try again."; state.classList.add("err"); }
    });
  }
  function flushNote(key) {
    const t = noteTimers.get(key);
    if (!t) return;
    clearTimeout(t.timer); noteTimers.delete(key);
    write(key, { note: t.value });
  }
  function setVerdict(v) {
    if (!canWrite) return;
    const key = ui.current;
    flushNote(key);
    const next = labelOf(key).verdict === v ? null : v;   // pressing the active verdict clears it
    write(key, { verdict: next, sentence: next === "unsupported" ? labelOf(key).sentence : null });
    renderCounts(); renderList(); renderVerdict(false);
    if (next === "supported") setTimeout(() => { if (ui.current === key) goNextOpen(); }, 280);
  }
  function pickSentence(i) {
    const key = ui.current;
    if (!canWrite || labelOf(key).verdict !== "unsupported") return;
    write(key, { sentence: i });
    renderCounts(); renderList(); renderVerdict(false);
  }

  function go(key) {
    if (!key || key === ui.current) return;
    flushNote(ui.current);
    ui.current = key; store.set("ui", ui);
    renderList(); renderDetail();
    window.scrollTo({ top: 0 });
    $("list").classList.remove("open"); $("list-toggle").setAttribute("aria-expanded", "false");
  }
  const step = d => { const i = ITEMS.findIndex(x => x.key === ui.current); go((ITEMS[i + d] || {}).key); };
  function goNextOpen() {
    const i = ITEMS.findIndex(x => x.key === ui.current);
    const next = ITEMS.slice(i + 1).concat(ITEMS.slice(0, i)).find(x => !done(x.key));
    if (next) go(next.key);
  }

  $("rows").addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b) go(b.dataset.k); });
  $("list-toggle").addEventListener("click", () => {
    const open = $("list").classList.toggle("open");
    $("list-toggle").setAttribute("aria-expanded", String(open));
  });
  $("detail").addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.id === "prev") step(-1);
    else if (t.id === "next") step(1);
    else if (t.id === "v-ok") setVerdict("supported");
    else if (t.id === "v-bad") setVerdict("unsupported");
    else if (t.dataset.s !== undefined) pickSentence(Number(t.dataset.s));
  });
  $("detail").addEventListener("toggle", e => { if (e.target.id === "rule") store.set("rule-closed", !e.target.open); }, true);
  $("detail").addEventListener("input", e => {
    if (e.target.id !== "note") return;
    const key = ui.current, value = e.target.value, t = noteTimers.get(key);
    if (t) clearTimeout(t.timer);
    noteTimers.set(key, { value, timer: setTimeout(() => flushNote(key), 900) });
    $("note-state").textContent = "Saving…";
  });
  $("detail").addEventListener("focusout", e => { if (e.target.id === "note") flushNote(ui.current); });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea") { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft" || e.key === "k") { e.preventDefault(); step(-1); }
    else if (e.key === "1") { e.preventDefault(); setVerdict("supported"); }
    else if (e.key === "2") { e.preventDefault(); setVerdict("unsupported"); }
  });

  function exportJson() {
    const out = {};
    for (const i of ITEMS) {
      const l = labels.get(i.key);
      if (l && (l.verdict || l.note)) out[i.key] = { verdict: l.verdict || null, sentence: Number.isInteger(l.sentence) ? l.sentence : null, note: l.note || "", at: l.at || null };
    }
    return JSON.stringify({ exported_at: new Date().toISOString(), reviews: out }, null, 2);
  }
  $("export").addEventListener("click", () => {
    for (const k of [...noteTimers.keys()]) flushNote(k);
    const text = exportJson(), count = Object.keys(JSON.parse(text).reviews).length;
    const panel = $("export-panel"), area = $("export-text"), msg = $("export-msg");
    area.value = text;
    const show = m => { msg.textContent = m; panel.hidden = false; };
    const fallback = () => { show(`Select all of the text below and copy it (${count} answers with a label or note).`); area.focus(); area.select(); };
    try {
      navigator.clipboard.writeText(text).then(() => show(`Copied ${count} answers with a label or note. Give them to Claude.`), fallback);
    } catch { fallback(); }
  });
  $("export-close").addEventListener("click", () => { $("export-panel").hidden = true; });
  const measure = () => document.documentElement.style.setProperty("--top-h", $("top").offsetHeight + "px");
  window.addEventListener("resize", measure);

  if (LOCAL) {
    for (const [k, l] of Object.entries(store.get("labels") || {})) if (ITEMS.some(i => i.key === k)) labels.set(k, l);
    canWrite = loaded = true;
    setSync("Labels are kept in this browser. Copy them often.");
  }
  renderAll(); measure();

  if (!LOCAL) {
    const timeout = setTimeout(() => { if (!loaded) { setSync("Saved labels didn't load. Reload the page.", true); } }, 10000);
    window.claude.use("db").then(d => {
      if (!d) { clearTimeout(timeout); setSync("Labels can't be loaded in this view.", true); loaded = true; renderVerdict(false); return; }
      db = d;
      db.collection("labels").onSnapshot(snap => {
        clearTimeout(timeout);
        labels.clear();
        for (const doc of snap.docs) labels.set(doc.id, doc.data());
        for (const [k, t] of noteTimers) labels.set(k, { ...labelOf(k), note: t.value });
        if (!loaded) {
          loaded = canWrite = true;
          setSync("Saved labels loaded");
          window.claude.use("user").then(u => {
            if (!u || !u.can) return;
            Promise.resolve(u.can("data.write")).then(v => { if (v === false) { canWrite = false; renderVerdict(false); } });
          }).catch(() => {});
          renderAll();
        } else { renderCounts(); renderList(); renderVerdict(false); }
      }, () => { clearTimeout(timeout); setSync("Lost the connection to saved labels. Reload the page.", true); canWrite = false; renderVerdict(false); });
    }).catch(() => { clearTimeout(timeout); setSync("Labels can't be loaded in this view.", true); loaded = true; renderVerdict(false); });
  }
})();
</script>
