<title>Gold Answer Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a reviewer's desk. Question list on the left, one question at a time on the right,
   the verdict bar pinned under it. The legal text is set in a serif, everything else in a sans. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #18202d;
  --muted: #5a6474;
  --rule: #dce1e9;
  --accent: #2440a8;
  --accent-soft: #e5e9f9;
  --ok: #1d7549;
  --ok-soft: #e1f1e8;
  --fix: #9a5200;
  --fix-soft: #fbefdc;
  --mark: #fff0a8;
  --mark-ink: #18202d;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-law: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-id: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #161b24; --ink: #e5e8ee; --muted: #98a1b0; --rule: #283040;
    --accent: #8fa3ff; --accent-soft: #1d2645; --ok: #5ccc8f; --ok-soft: #13301f;
    --fix: #f0a54a; --fix-soft: #3a2911; --mark: #5c4c12; --mark-ink: #fff6d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #161b24; --ink: #e5e8ee; --muted: #98a1b0; --rule: #283040;
  --accent: #8fa3ff; --accent-soft: #1d2645; --ok: #5ccc8f; --ok-soft: #13301f;
  --fix: #f0a54a; --fix-soft: #3a2911; --mark: #5c4c12; --mark-ink: #fff6d6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--rule);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.brand small { color: var(--muted); font-size: 12.5px; }
.brand code { font-family: var(--font-id); font-size: 12px; }
.progress { flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--rule); }
.bar span { display: block; height: 100%; transition: width .3s ease; }
.bar .b-ok { background: var(--ok); }
.bar .b-fix { background: var(--fix); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 600; }
.sync { font-size: 12.5px; color: var(--muted); }
.sync.warn { color: var(--fix); }
.list-toggle { display: none; }
.tool { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.export { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--accent-soft); border-bottom: 1px solid var(--rule); }
.export-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.export-inner p { margin: 0; font-size: 13.5px; }
.export-inner textarea { width: 100%; font-family: var(--font-id); font-size: 12px; padding: 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }

.layout {
  display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 24px;
  max-width: 1400px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Question list */
.list {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 20px);
  align-self: start; max-height: calc(100vh - var(--top-h) - 40px);
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { grid-column: 1 / -1; display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: none; padding: 6px 4px; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.filters select { width: 100%; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); font-size: 13px; }
.rows { list-style: none; margin: 0; padding: 0; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); min-height: 120px; }
.rows li + li { border-top: 1px solid var(--rule); }
.rows button {
  display: grid; grid-template-columns: 14px 44px minmax(0, 1fr); gap: 8px; align-items: baseline;
  width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px;
}
.rows button:hover { background: var(--bg); }
.rows button[aria-current="true"] { background: var(--accent-soft); }
.rows .qid { font-family: var(--font-id); font-size: 12.5px; color: var(--muted); }
.rows .qt { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-list { padding: 16px; color: var(--muted); font-size: 13.5px; }

.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; transform: translateY(1px); }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.fix { background: var(--fix); border-color: var(--fix); }

/* One question */
.detail { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.head .qid { font-family: var(--font-id); font-size: 14px; font-weight: 500; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--surface); white-space: nowrap; }
.chip.type { color: var(--accent); border-color: transparent; background: var(--accent-soft); font-weight: 500; }
.chip.test { color: var(--fix); border-color: var(--fix); }
.nav { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 4px 10px; }
.question { margin: 0; font-size: 22px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; max-width: 48ch; }
.check { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 72ch; }

.section { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.answer { margin: 0; font-size: 16px; max-width: 72ch; }
.answer.none { color: var(--muted); font-style: italic; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-family: var(--font-id); font-size: 12.5px; padding: 2px 8px; border-radius: 4px; background: var(--mark); color: var(--mark-ink); }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.notes { margin: 0; font-size: 14.5px; max-width: 72ch; padding: 10px 14px; border-left: 3px solid var(--rule); background: var(--surface); border-radius: 0 6px 6px 0; }

.node { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); overflow: hidden; }
.node-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.node-id { font-family: var(--font-id); font-size: 13px; font-weight: 500; }
.node-path { font-size: 12.5px; color: var(--muted); flex: 1 1 240px; min-width: 0; }
.node-head a { font-size: 12.5px; white-space: nowrap; }
.law { margin: 0; padding: 12px 14px; font-family: var(--font-law); font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 78ch; }
.law.lead-in { padding-bottom: 0; color: var(--muted); font-size: 14.5px; }
.node-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 14px 10px; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--rule); }
.node-foot button { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.context { border-top: 1px solid var(--rule); background: var(--bg); }
.context .law { font-size: 15px; color: var(--ink); }
.context .ctx-label { padding: 10px 14px 0; font-size: 12px; color: var(--muted); }

/* Verdict */
.verdict {
  position: sticky; bottom: 0; z-index: 3;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 14px; align-items: start;
  box-shadow: 0 -6px 18px -12px rgba(10, 20, 40, .35);
}
.verdict-buttons { display: flex; gap: 8px; }
.vbtn { border: 1.5px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.vbtn kbd { font-family: var(--font-id); font-size: 11px; font-weight: 400; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }
.vbtn.ok[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.vbtn.fix[aria-pressed="true"] { background: var(--fix-soft); border-color: var(--fix); color: var(--fix); }
.vbtn:disabled { opacity: .5; cursor: not-allowed; }
.note-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.note-wrap textarea { width: 100%; min-height: 44px; resize: vertical; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); font-size: 14px; line-height: 1.45; }
.note-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); }
.note-meta .err { color: var(--fix); }
.keys { font-size: 12px; color: var(--muted); }
.keys kbd { font-family: var(--font-id); font-size: 11px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }

@media (max-width: 899px) {
  .top { position: static; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .list { position: static; max-height: none; }
  .list:not(.open) { display: none; }
  .rows { max-height: 55vh; }
  .list-toggle { display: inline-block; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
  .question { font-size: 19px; }
  .verdict { grid-template-columns: minmax(0, 1fr); }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

<header class="top" id="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Gold answer review</h1>
      <small>Issue #17 · <code>data/questions.v1.jsonl</code></small>
    </div>
    <div class="progress">
      <div class="bar" aria-hidden="true"><span class="b-ok" id="bar-ok"></span><span class="b-fix" id="bar-fix"></span></div>
      <div class="counts" id="counts"></div>
    </div>
    <span class="sync" id="sync">Connecting to saved reviews…</span>
    <button class="tool" id="export" type="button" title="Copy every verdict and note as JSON, to hand to Claude">Copy verdicts</button>
    <button class="tool" id="save-file" type="button" hidden>Save verdicts file</button>
    <button class="tool" id="load-file" type="button" hidden>Load verdicts file</button>
    <input type="file" id="load-input" accept="application/json,.json" hidden>
    <button class="list-toggle" id="list-toggle" type="button" aria-expanded="false" aria-controls="list">All questions</button>
  </div>
</header>

<section class="export" id="export-panel" hidden aria-label="Verdicts as JSON">
  <div class="export-inner">
    <p id="export-msg"></p>
    <textarea id="export-text" rows="6" readonly aria-label="Verdicts as JSON"></textarea>
    <button class="tool" id="export-close" type="button">Close</button>
  </div>
</section>

<div class="layout">
  <nav class="list" id="list" aria-label="Questions">
    <div class="filters">
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-status="todo" aria-pressed="true">To review</button>
        <button type="button" data-status="fix" aria-pressed="false">Needs a fix</button>
        <button type="button" data-status="ok" aria-pressed="false">Correct</button>
        <button type="button" data-status="all" aria-pressed="false">All</button>
      </div>
      <select id="f-type" aria-label="Question type"></select>
      <select id="f-split" aria-label="Split">
        <option value="">Dev and test</option>
        <option value="dev">Dev only</option>
        <option value="test">Test only</option>
      </select>
    </div>
    <ul class="rows" id="rows"></ul>
  </nav>

  <main class="detail" id="detail"></main>
</div>

<script id="review-data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("review-data").textContent);
  const QS = DATA.questions;
  const TYPE_NAMES = {
    single_fact: "Single fact", definition: "Definition", exception: "Exception",
    multi_article: "Multi-article", cross_act: "Cross-act", unanswerable: "Unanswerable",
    version_trap: "Version trap",
  };
  const CHECKS = {
    single_fact: "Does the gold text give this value? Are the key facts the right numbers and units?",
    definition: "Does the answer match the definition in the gold text, without adding to it?",
    exception: "Are the conditions complete and correctly stated? Check for a condition the answer leaves out.",
    multi_article: "Is each gold node needed for the answer, and is none missing?",
    cross_act: "Does each act contribute what the answer says it does?",
    unanswerable: "Confirm that nothing in the corpus answers this. The notes give the search terms used.",
    version_trap: "The answer must match the current text below. The notes give the old answer, which should now be wrong.",
  };
  const NOTE_LABELS = {
    unanswerable: "Why it is unanswerable, and the search",
    version_trap: "What changed, and the old answer",
  };

  // ---- per-viewer conveniences ----
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("gar:" + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("gar:" + k, JSON.stringify(v)); } catch {} },
  };
  const firstVisit = !store.get("ui");
  const ui = Object.assign({ status: "todo", type: "", split: "", current: QS[0].id }, store.get("ui") || {});
  if (!QS.some(q => q.id === ui.current)) ui.current = QS[0].id;
  const saveUi = () => store.set("ui", ui);

  // ---- reviews, from the shared store ----
  const reviews = new Map();        // qid -> {verdict, note, at}
  let db = null;
  let canWrite = false;
  let loaded = false;
  const chains = new Map();         // qid -> promise; one write at a time per document
  const noteTimers = new Map();

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Opened as a plain file, outside claude.ai: verdicts are kept in this browser instead.
  const LOCAL = !(window.claude && typeof window.claude.use === "function");
  const LOCAL_KEY = "gar:reviews";
  // Questions already marked checked in the repo count as correct until a verdict says otherwise.
  const CHECKED = new Set(QS.filter(q => q.checked).map(q => q.id));
  const verdictOf = id => reviews.has(id) ? reviews.get(id).verdict || null : CHECKED.has(id) ? "ok" : null;

  function setSync(text, warn) {
    const el = $("sync");
    el.textContent = text;
    el.classList.toggle("warn", !!warn);
  }

  // ---- highlighting key facts ----
  const WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
  const EXTRA = { 15: "fifteen", 20: "twenty", 24: "twenty-four", 30: "thirty", 45: "forty-five" };
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  function factPatterns(fact) {
    const pats = [reEsc(fact)];
    const m = fact.match(/^(\d+(?:\.\d+)?)\s+([A-Za-z]+)/);
    if (m) {
      const n = m[1], unit = m[2].toLowerCase();
      const forms = [reEsc(n)];
      if (n.includes(".")) forms.push(reEsc(n.replace(".", ",")));
      const i = Number(n);
      if (Number.isInteger(i) && WORDS[i]) forms.push(WORDS[i]);
      if (EXTRA[i]) forms.push(EXTRA[i]);
      const stem = reEsc(unit.slice(0, Math.min(4, unit.length)));
      pats.push(`\\b(?:${forms.join("|")})(?:[\\s\\u00a0-]+)${stem}[a-z]*`);
    }
    return pats;
  }
  function highlight(text, facts) {
    if (!facts.length) return esc(text);
    const re = new RegExp(facts.flatMap(factPatterns).map(p => `(?:${p})`).join("|"), "gi");
    let out = "", last = 0;
    for (const m of text.matchAll(re)) {
      if (!m[0]) continue;
      out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  // ---- filtering ----
  function visible() {
    return QS.filter(q => {
      const v = verdictOf(q.id);
      if (ui.status === "todo" && v) return false;
      if (ui.status === "ok" && v !== "ok") return false;
      if (ui.status === "fix" && v !== "fix") return false;
      if (ui.type && q.type !== ui.type) return false;
      if (ui.split && q.split !== ui.split) return false;
      return true;
    });
  }

  function renderCounts() {
    let ok = 0, fix = 0;
    for (const q of QS) { const v = verdictOf(q.id); if (v === "ok") ok++; else if (v === "fix") fix++; }
    const n = QS.length;
    $("bar-ok").style.width = (100 * ok / n) + "%";
    $("bar-fix").style.width = (100 * fix / n) + "%";
    $("counts").innerHTML =
      `<span><b>${ok + fix}</b> of ${n} reviewed</span>` +
      `<span><b>${ok}</b> correct</span>` +
      `<span><b>${fix}</b> need a fix</span>` +
      `<span><b>${n - ok - fix}</b> to review</span>`;
  }

  function renderList() {
    const rows = visible();
    const el = $("rows");
    if (!rows.length) {
      const msg = ui.status === "todo" && loaded
        ? "Nothing left to review with these filters."
        : "No questions match these filters.";
      el.innerHTML = `<li class="empty-list">${msg}</li>`;
      return;
    }
    el.innerHTML = rows.map(q => {
      const v = verdictOf(q.id);
      const label = v === "ok" ? "correct" : v === "fix" ? "needs a fix" : "to review";
      return `<li><button type="button" data-q="${q.id}" aria-current="${q.id === ui.current}" title="${esc(q.question)}">` +
        `<span class="dot ${v || ""}" role="img" aria-label="${label}"></span>` +
        `<span class="qid">${q.id}</span><span class="qt">${esc(q.question)}</span></button></li>`;
    }).join("");
    const cur = el.querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  function nodeCard(id, facts) {
    const n = DATA.nodes[id];
    const isNote = !n.source;
    const ctx = n.context_id ? DATA.contexts[n.context_id] : null;
    const foot = [];
    if (n.amended.length) foot.push(`<span>Amended by ${n.amended.map(c => `<code>${esc(c)}</code>`).join(", ")}</span>`);
    if (n.published) foot.push(`<span>Note dated ${esc(n.published)}</span>`);
    if (ctx) foot.push(`<button type="button" data-ctx="${esc(n.context_id)}" aria-expanded="false">Show all of ${esc(ctx.path[ctx.path.length - 1])}</button>`);
    return `<article class="node">
      <div class="node-head">
        <span class="node-id">${esc(id)}</span>
        <span class="node-path">${esc(n.path.join(" › "))}</span>
        <a href="${esc(n.link)}" target="_blank" rel="noopener">${isNote ? "Open the PDF" : "Open on EUR-Lex"} ↗</a>
      </div>
      ${n.lead_in ? `<p class="law lead-in">${esc(n.lead_in)}</p>` : ""}
      <p class="law">${highlight(n.text, facts)}</p>
      ${foot.length ? `<div class="node-foot">${foot.join("")}</div>` : ""}
      ${ctx ? `<div class="context" data-for="${esc(n.context_id)}" hidden><div class="ctx-label">${esc(ctx.path.join(" › "))}</div><p class="law">${highlight(ctx.text, facts)}</p></div>` : ""}
    </article>`;
  }

  function renderDetail() {
    const q = QS.find(x => x.id === ui.current);
    const rows = visible();
    const pos = rows.findIndex(x => x.id === q.id);
    const posText = pos >= 0 ? `${pos + 1} of ${rows.length}` : `not in this list`;
    const answer = q.answer
      ? `<p class="answer">${highlight(q.answer, q.key_facts)}</p>`
      : `<p class="answer none">No gold answer: the system should refuse this question.</p>`;
    const facts = q.key_facts.length
      ? `<div class="facts" aria-label="Key facts">${q.key_facts.map(f => `<span class="fact">${esc(f)}</span>`).join("")}</div>` : "";
    const notes = q.notes
      ? `<section class="section"><div class="label">${NOTE_LABELS[q.type] || "Notes"}</div><p class="notes">${esc(q.notes)}</p></section>` : "";
    const gold = q.gold_node_ids.length
      ? `<section class="section"><div class="label">Gold text · ${q.gold_node_ids.length} node${q.gold_node_ids.length > 1 ? "s" : ""}</div>${q.gold_node_ids.map(id => nodeCard(id, q.key_facts)).join("")}</section>` : "";

    $("detail").innerHTML = `
      <div class="head">
        <span class="qid">${q.id}</span>
        <span class="chip type">${TYPE_NAMES[q.type]}</span>
        <span class="chip">${q.phrasing}</span>
        <span class="chip ${q.split === "test" ? "test" : ""}">${q.split}</span>
        <div class="nav">
          <span>${posText}</span>
          <button type="button" id="prev" aria-label="Previous question">←</button>
          <button type="button" id="next" aria-label="Next question">→</button>
        </div>
      </div>
      <h2 class="question">${esc(q.question)}</h2>
      <p class="check">${CHECKS[q.type]}</p>
      <section class="section"><div class="label">Gold answer</div>${answer}${facts}</section>
      ${notes}
      ${gold}
      <section class="verdict" aria-label="Your verdict">
        <div class="verdict-buttons">
          <button type="button" class="vbtn ok" id="v-ok" aria-pressed="false">Correct <kbd>1</kbd></button>
          <button type="button" class="vbtn fix" id="v-fix" aria-pressed="false">Needs a fix <kbd>2</kbd></button>
        </div>
        <div class="note-wrap">
          <textarea id="note" rows="2" placeholder="What should change? A wrong value, a missing condition, a gold node to add or drop…" aria-label="Correction for ${q.id}"></textarea>
          <div class="note-meta"><span id="note-state"></span><span class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> correct · <kbd>2</kbd> needs a fix</span></div>
        </div>
      </section>`;
    renderVerdict(true);
  }

  function renderVerdict(fillNote) {
    const r = reviews.get(ui.current) || {};
    const ok = $("v-ok"), fix = $("v-fix"), note = $("note");
    if (!ok) return;
    ok.setAttribute("aria-pressed", String(r.verdict === "ok"));
    fix.setAttribute("aria-pressed", String(r.verdict === "fix"));
    ok.disabled = fix.disabled = !canWrite;
    note.disabled = !canWrite;
    if (fillNote || document.activeElement !== note) {
      if (!noteTimers.has(ui.current)) note.value = r.note || "";
    }
    const state = $("note-state");
    if (!canWrite) state.textContent = loaded ? "Read only: only the owner can record verdicts." : "Waiting for saved reviews…";
    else if (!reviews.has(ui.current) && CHECKED.has(ui.current)) state.textContent = "Marked checked in the questions file";
    else if (r.at) state.textContent = "Saved " + new Date(r.at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    else state.textContent = "Not reviewed yet";
    state.classList.remove("err");
  }

  function renderAll() { renderCounts(); renderList(); renderDetail(); }
  function refreshFromStore() {
    renderCounts(); renderList(); renderVerdict(false);
  }

  // ---- writing ----
  function write(qid, patch) {
    if ((!db && !LOCAL) || !canWrite) return Promise.resolve();
    const prev = reviews.get(qid) || { verdict: verdictOf(qid) };
    const body = { verdict: prev.verdict || null, note: prev.note || "", ...patch, at: new Date().toISOString() };
    reviews.set(qid, body);                         // optimistic
    if (LOCAL) { saveLocal(); return Promise.resolve(); }
    const run = () => db.doc("reviews/" + qid).set(body);
    const chain = (chains.get(qid) || Promise.resolve()).then(run, run);
    chains.set(qid, chain.catch(() => {}));
    return chain.catch(e => {
      const state = $("note-state");
      if (state && ui.current === qid) {
        state.textContent = e && e.code === "invalid_argument"
          ? "Couldn't save: this view can't record verdicts. Open the page as its owner."
          : "Couldn't save. Check your connection, then try again.";
        state.classList.add("err");
      }
      if (e && e.code === "invalid_argument") { canWrite = false; renderVerdict(false); }
    });
  }

  function flushNote(qid) {
    const t = noteTimers.get(qid);
    if (!t) return;
    clearTimeout(t.timer);
    noteTimers.delete(qid);
    write(qid, { note: t.value });
  }

  function setVerdict(v) {
    if (!canWrite) return;
    const qid = ui.current;
    flushNote(qid);
    const cur = verdictOf(qid);
    const next = cur === v ? null : v;                // pressing the active verdict clears it
    write(qid, { verdict: next }).then(() => renderVerdict(false));
    renderCounts(); renderList(); renderVerdict(false);
    if (next === "fix") $("note").focus();
    if (next === "ok") setTimeout(() => { if (ui.current === qid) goNextOpen(); }, 280);
  }

  // ---- navigation ----
  function go(id) {
    if (!id || id === ui.current) return;
    flushNote(ui.current);
    ui.current = id; saveUi();
    renderList(); renderDetail();
    window.scrollTo({ top: 0 });
    $("list").classList.remove("open");
    $("list-toggle").setAttribute("aria-expanded", "false");
  }
  function step(d) {
    // Move within the filtered list; if the current question has left it, move in the full order.
    const rows = visible();
    let i = rows.findIndex(q => q.id === ui.current);
    if (i < 0) {
      const all = QS.findIndex(q => q.id === ui.current);
      const after = rows.filter(q => QS.indexOf(q) > all);
      const before = rows.filter(q => QS.indexOf(q) < all);
      return go(d > 0 ? (after[0] || rows[0] || {}).id : (before[before.length - 1] || rows[rows.length - 1] || {}).id);
    }
    go((rows[i + d] || {}).id);
  }
  function goNextOpen() {
    const all = QS.findIndex(q => q.id === ui.current);
    const order = QS.slice(all + 1).concat(QS.slice(0, all));
    const next = order.find(q => !verdictOf(q.id) && (!ui.type || q.type === ui.type) && (!ui.split || q.split === ui.split));
    if (next) go(next.id); else renderList();
  }

  // ---- events ----
  const typeSel = $("f-type");
  typeSel.innerHTML = `<option value="">All types</option>` +
    Object.entries(TYPE_NAMES).map(([k, v]) => `<option value="${k}">${v} (${QS.filter(q => q.type === k).length})</option>`).join("");
  typeSel.value = ui.type; $("f-split").value = ui.split;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.status === ui.status)));

  document.querySelector(".seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    ui.status = b.dataset.status; saveUi();
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderList(); renderDetail();
  });
  typeSel.addEventListener("change", () => { ui.type = typeSel.value; saveUi(); renderList(); renderDetail(); });
  $("f-split").addEventListener("change", e => { ui.split = e.target.value; saveUi(); renderList(); renderDetail(); });
  $("rows").addEventListener("click", e => { const b = e.target.closest("button[data-q]"); if (b) go(b.dataset.q); });
  $("list-toggle").addEventListener("click", () => {
    const open = $("list").classList.toggle("open");
    $("list-toggle").setAttribute("aria-expanded", String(open));
  });

  $("detail").addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.id === "prev") step(-1);
    else if (t.id === "next") step(1);
    else if (t.id === "v-ok") setVerdict("ok");
    else if (t.id === "v-fix") setVerdict("fix");
    else if (t.dataset.ctx) {
      const box = t.closest(".node").querySelector(".context");
      box.hidden = !box.hidden;
      t.setAttribute("aria-expanded", String(!box.hidden));
      t.textContent = (box.hidden ? "Show all of " : "Hide ") + DATA.contexts[t.dataset.ctx].path.slice(-1)[0];
    }
  });
  $("detail").addEventListener("input", e => {
    if (e.target.id !== "note") return;
    const qid = ui.current, value = e.target.value;
    const t = noteTimers.get(qid);
    if (t) clearTimeout(t.timer);
    noteTimers.set(qid, { value, timer: setTimeout(() => flushNote(qid), 900) });
    $("note-state").textContent = "Saving…";
  });
  $("detail").addEventListener("focusout", e => { if (e.target.id === "note") flushNote(ui.current); });

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea" || tag === "input" || tag === "select") {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    if (e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft" || e.key === "k") { e.preventDefault(); step(-1); }
    else if (e.key === "1") { e.preventDefault(); setVerdict("ok"); }
    else if (e.key === "2") { e.preventDefault(); setVerdict("fix"); }
  });

  // ---- export, for handing the verdicts to Claude ----
  function exportJson() {
    const out = {};
    for (const q of QS) {
      const r = reviews.get(q.id);
      if (r && (r.verdict || r.note)) out[q.id] = { verdict: r.verdict || null, note: r.note || "", at: r.at || null };
    }
    return JSON.stringify({ exported_at: new Date().toISOString(), questions_file: "data/questions.v1.jsonl", reviews: out }, null, 2);
  }
  $("export").addEventListener("click", () => {
    for (const qid of [...noteTimers.keys()]) flushNote(qid);
    const text = exportJson();
    const count = Object.keys(JSON.parse(text).reviews).length;
    const panel = $("export-panel"), area = $("export-text"), msg = $("export-msg");
    area.value = text;
    const show = m => { msg.textContent = m; panel.hidden = false; };
    const fallback = () => { show(`Select all of the text below and copy it (${count} questions with a verdict or note).`); area.focus(); area.select(); };
    try {
      navigator.clipboard.writeText(text).then(
        () => show(`Copied ${count} questions with a verdict or note. Paste them into a file such as build/gold-review/verdicts.json and give it to Claude.`),
        fallback);
    } catch { fallback(); }
  });
  $("export-close").addEventListener("click", () => { $("export-panel").hidden = true; });

  const measure = () => document.documentElement.style.setProperty("--top-h", $("top").offsetHeight + "px");
  window.addEventListener("resize", measure);

  // ---- local mode: this browser's storage, plus a file to back up and hand over ----
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Object.fromEntries(reviews))); }
    catch { setSync("This browser won't keep verdicts. Use Save verdicts file often.", true); }
  }
  function loadLocal() {
    try {
      const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}");
      for (const [qid, r] of Object.entries(saved)) if (QS.some(q => q.id === qid)) reviews.set(qid, r);
    } catch {}
  }
  $("save-file").addEventListener("click", () => {
    for (const qid of [...noteTimers.keys()]) flushNote(qid);
    const blob = new Blob([exportJson()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `gold-verdicts-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setSync(`Saved ${a.download}`);
  });
  $("load-file").addEventListener("click", () => $("load-input").click());
  $("load-input").addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    let incoming;
    try { incoming = JSON.parse(await file.text()).reviews; } catch { incoming = null; }
    if (!incoming || typeof incoming !== "object") {
      setSync(`${file.name} isn't a verdicts file. Pick a file saved from this page.`, true);
      return;
    }
    let taken = 0, skipped = 0;
    for (const [qid, r] of Object.entries(incoming)) {
      if (!QS.some(q => q.id === qid) || !r || typeof r !== "object") { skipped++; continue; }
      const mine = reviews.get(qid);
      // Keep whichever verdict is newer, so loading an old file never undoes later work.
      if (mine && mine.at && (!r.at || r.at <= mine.at)) { skipped++; continue; }
      reviews.set(qid, { verdict: r.verdict === "ok" || r.verdict === "fix" ? r.verdict : null, note: String(r.note || ""), at: r.at || null });
      taken++;
    }
    saveLocal();
    setSync(`Loaded ${taken} verdict${taken === 1 ? "" : "s"} from ${file.name}` + (skipped ? `; kept ${skipped} newer here` : ""));
    renderAll();
  });

  // ---- start ----
  if (LOCAL) {
    loadLocal();
    canWrite = true; loaded = true;
    $("save-file").hidden = $("load-file").hidden = false;
    setSync("Verdicts are kept in this browser. Save a verdicts file to back them up.");
    if (firstVisit) ui.current = (visible()[0] || QS[0]).id;
  }
  renderAll(); measure();

  const use = LOCAL ? null : window.claude && typeof window.claude.use === "function" ? window.claude.use("db") : Promise.resolve(null);
  if (use) use.then(d => {
    if (!d) { setSync("Reviews can't be loaded in this view.", true); loaded = true; renderVerdict(false); return; }
    db = d;
    db.collection("reviews").onSnapshot(snap => {
      reviews.clear();
      for (const doc of snap.docs) reviews.set(doc.id, doc.data());
      // Keep notes being typed on screen until they are saved.
      for (const [qid, t] of noteTimers) reviews.set(qid, { ...(reviews.get(qid) || {}), note: t.value });
      const first = !loaded;
      loaded = true;
      if (first) {
        canWrite = true;
        setSync("Saved reviews loaded");
        if (window.claude && window.claude.use) {
          window.claude.use("user").then(u => {
            if (!u) return;
            const p = u.can ? u.can("data.write") : null;
            Promise.resolve(p).then(v => { if (v === false) { canWrite = false; renderVerdict(false); } });
          }).catch(() => {});
        }
        renderAll();
      } else {
        refreshFromStore();
      }
    }, err => {
      setSync("Lost the connection to saved reviews. Reload the page.", true);
      canWrite = false; renderVerdict(false);
    });
  }).catch(() => { setSync("Reviews can't be loaded in this view.", true); loaded = true; renderVerdict(false); });
})();
</script>
