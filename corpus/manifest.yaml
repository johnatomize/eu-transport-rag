# Every document in the corpus, pinned to an exact version (docs/DESIGN.md, "The corpus").
#
# id         short document ID; the prefix of every node ID, such as "561/2006:art6(3)"
# kind       act (legislation) or guidance (Commission guidance and clarification notes)
# phase      1 or 2; phase 2 joins after checkpoint G (docs/DESIGN.md)
# celex      for an act: exactly the version that is cited
# adopted    for an act pinned to its original text (a celex starting with 3): the day it was
#            adopted, which an answer names as the version it quotes. Only an act that was
#            never amended is pinned this way, and citations say "never amended"; an amended
#            act is pinned to a consolidated version
# format     xhtml, html or pdf; picks the parser
# sha256     hash of the raw file; written, with retrieved, by scripts/fetch_corpus.py --pin
# published  for a guidance note: when its content was written, as YYYY-MM-DD, or YYYY-MM when
#            only the month is known; acts are dated by their celex instead
# published_source
#            where that date comes from: letter (the Commission letter a clarification note
#            records, dated on page 1), pdf (the file's creation date in its metadata, so the
#            note existed by then but may be older) or commission-page (a publication date
#            on the Commission's page). The page checked on 2026-10-28 gives only upload
#            dates (20 July 2021 for 15 notes, the day they moved to the site), so no note
#            uses commission-page
#
# Language is English for now; the .en in each file name leaves room for Swedish (checkpoint L).
