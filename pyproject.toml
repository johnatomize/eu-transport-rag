[project]
name = "eu-transport-rag"
version = "0.1.0"
description = "Retrieval-augmented question answering over EU road transport legislation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3[crt]>=1.40",
    "pdfminer-six>=20260107",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "snowballstemmer>=3.1.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=9.1",
    "ruff>=0.17",
]
# The local embedding model's libraries (`make embed RUN=1`). Not installed by `make install`, so
# `make check` and CI stay light: they read cached vectors and never run the model.
local-embed = [
    "sentence-transformers>=5",
    "torch>=2.8",
    "transformers>=4.51",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Ignore releases younger than a week, so a broken or compromised release has time to be yanked.
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "rag"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `db` need the local Postgres and run with `make test-db`; `-m db` there overrides
# the "not db" here, so `make test` and `make check` stay offline.
addopts = ["--strict-markers", "-m", "not db"]
markers = ["db: needs the local Postgres + pgvector from `make db-up`"]
